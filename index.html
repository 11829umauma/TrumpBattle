<!doctype html>
<!-- トランプバトルのブラウザ版のページ（trump/tools/web.cmd が love.js の出力の index.html をこれで置き換える。元は Love2D/tools/web/index.html）。
     canvas は窓いっぱい（ここの CSS で決める）。2:3 のゲーム画面と余りの黒帯はゲーム側（lib/viewport）が描くので、
     黒帯の上の指もゲームに届く（canvas を 2:3 にしていたときは、余白の操作が効かなかった）。
     ゲーム側（conf.lua の highdpi）は canvas の大きさ x 画面のピクセル密度で描く（ブラウザに引き伸ばさせると文字が潰れるため） -->
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>トランプバトル</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
      body { display: flex; align-items: center; justify-content: center; touch-action: none;
             -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      #canvas { display: block; position: fixed; left: 0; top: 0; width: 100vw; height: 100dvh;
                visibility: hidden; outline: none; }
      #loading { display: block; height: min(100dvh, 150vw); width: min(100vw, 66.667dvh); }
      #loading { position: absolute; color: #8ec3e3; font: 20px sans-serif; display: flex;
                 align-items: center; justify-content: center; text-align: center; white-space: pre-line; }
    </style>
  </head>
  <body>
    <div id="loading">読み込み中…</div>
    <canvas id="canvas" width="480" height="720" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
    <script src="netbridge.js"></script>
    <script src="gate.js"></script>
    <script>
      var canvas = document.getElementById("canvas");
      var loading = document.getElementById("loading");
      // 確認用: ?shot を付けて開くと描いた画面を残す（canvas.toBlob で撮れるように。tools/web/serve.js の /__shot）
      if (/[?&]shot\b/.test(location.search)) {
        var getContext = HTMLCanvasElement.prototype.getContext;
        HTMLCanvasElement.prototype.getContext = function (type, attrs) {
          return getContext.call(this, type, Object.assign({}, attrs, { preserveDrawingBuffer: true }));
        };
      }
      function focusGame() { window.focus(); canvas.focus(); }
      window.onload = focusGame;
      window.addEventListener("pointerdown", focusGame);
      // 矢印キー・スペースでページがスクロールしないように
      window.addEventListener("keydown", function (e) {
        if ([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) e.preventDefault();
      }, false);
      canvas.addEventListener("webglcontextlost", function (e) {
        alert("画面の描画が止まりました。ページを読み込み直してください。");
        e.preventDefault();
      }, false);

      var Module = {
        arguments: ["./game.love"],
        INITIAL_MEMORY: 268435456,
        // ゲームの print。通信対戦の依頼（@@net@@ で始まる行）は netbridge.js へ
        print: function (text) {
          if (window.netBridge && window.netBridge.handle(text)) return;
          console.log(text);
        },
        printErr: console.error.bind(console),
        canvas: canvas,
        setStatus: function (text) {
          if (text) {
            loading.textContent = text;
          } else if (Module.remainingDependencies === 0) {
            loading.style.display = "none";
            canvas.style.visibility = "visible";
          }
        },
        totalDependencies: 0,
        remainingDependencies: 0,
        monitorRunDependencies: function (left) {
          this.remainingDependencies = left;
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ? "準備中… (" + (this.totalDependencies - left) + "/" + this.totalDependencies + ")" : "");
        }
      };
      Module.setStatus("読み込み中…");
      window.onerror = function () {
        loading.style.display = "flex";
        loading.textContent = "エラーで止まりました。\nページを読み込み直してください。";
        Module.setStatus = function (text) { if (text) console.error(text); };
      };
      function loadScript(src, onload) {
        var s = document.createElement("script");
        s.src = src;
        if (onload) s.onload = onload;
        document.body.appendChild(s);
      }
      // game.js（ゲーム本体 game.data の読み込み）→ love.js（LÖVE）の順に読む。
      // 公開版（tools\web_publish.cmd）は gate.js が先に入り、パスワードで game.data を復号してから startGame を呼ぶ
      function startGame() {
        loadScript("game.js", function () { loadScript("love.js", function () { Love(Module); }); });
      }
      if (window.gate) window.gate(Module, startGame); else startGame();
    </script>
  </body>
</html>
